version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: support_system_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-support_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support_password}
      POSTGRES_DB: support_system
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-support_user} -d support_system"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Add .env file support
    env_file:
      - .env
    networks:
      - support_network

  redis:
    image: redis:7-alpine
    container_name: support_system_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - support_network

  ollama:
    image: ollama/ollama:latest
    container_name: support_system_ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - support_network

  backend:
    build: .
    container_name: support_system_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-support_user}:${POSTGRES_PASSWORD:-support_password}@postgres:5432/support_system
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_BASE_URL=http://ollama:11434/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY:-ollama}
      - MODEL_NAME=${MODEL_NAME:-llama3}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app:/app/app
      - ./ai_core:/app/ai_core
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      - ./logs:/app/logs
      - ./seed_data.py:/app/seed_data.py
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    # Add .env file support
    env_file:
      - .env
    networks:
      - support_network

volumes:
  postgres_data:
  redis_data:
  ollama_data:

networks:
  support_network:
    driver: bridge
